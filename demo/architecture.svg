<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 620" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c1652b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1400" height="620" fill="#ffffff"/>

  <text x="40" y="34" font-size="22" font-weight="700" fill="#12312a">Shopping Copilot — the six-step turn loop</text>

  <!-- ============ Pipeline boxes ============ -->
  <g font-size="13">
    <!-- 1 Understand -->
    <rect x="40" y="70" width="180" height="80" rx="10" fill="#e7f3f1" stroke="#1a6b63" stroke-width="1.5"/>
    <text x="130" y="94" text-anchor="middle" font-weight="700" fill="#12312a">1. UNDERSTAND</text>
    <text x="130" y="114" text-anchor="middle" fill="#3a4a46">Parse message into</text>
    <text x="130" y="130" text-anchor="middle" fill="#3a4a46">structured facts</text>

    <!-- 2 Route -->
    <rect x="260" y="70" width="180" height="80" rx="10" fill="#e7f3f1" stroke="#1a6b63" stroke-width="1.5"/>
    <text x="350" y="94" text-anchor="middle" font-weight="700" fill="#12312a">2. ROUTE</text>
    <text x="350" y="114" text-anchor="middle" fill="#3a4a46">Buying (filter hard) vs</text>
    <text x="350" y="130" text-anchor="middle" fill="#3a4a46">Browsing (search broad)</text>

    <!-- 3 Retrieve -->
    <rect x="480" y="70" width="180" height="80" rx="10" fill="#e7f3f1" stroke="#1a6b63" stroke-width="1.5"/>
    <text x="570" y="94" text-anchor="middle" font-weight="700" fill="#12312a">3. RETRIEVE</text>
    <text x="570" y="114" text-anchor="middle" fill="#3a4a46">Hybrid keyword + semantic,</text>
    <text x="570" y="130" text-anchor="middle" fill="#3a4a46">fused by rank (RRF)</text>

    <!-- 4 Clarify/Answer -->
    <rect x="700" y="70" width="180" height="80" rx="10" fill="#e7f3f1" stroke="#1a6b63" stroke-width="1.5"/>
    <text x="790" y="94" text-anchor="middle" font-weight="700" fill="#12312a">4. CLARIFY / ANSWER</text>
    <text x="790" y="114" text-anchor="middle" fill="#3a4a46">Ask the most informative</text>
    <text x="790" y="130" text-anchor="middle" fill="#3a4a46">question, or answer</text>

    <!-- 5 Rank -->
    <rect x="920" y="70" width="180" height="80" rx="10" fill="#e7f3f1" stroke="#1a6b63" stroke-width="1.5"/>
    <text x="1010" y="94" text-anchor="middle" font-weight="700" fill="#12312a">5. RANK</text>
    <text x="1010" y="114" text-anchor="middle" fill="#3a4a46">Blend relevance, rating,</text>
    <text x="1010" y="130" text-anchor="middle" fill="#3a4a46">popularity, slot-fit</text>

    <!-- 6 Respond -->
    <rect x="1140" y="70" width="180" height="80" rx="10" fill="#e7f3f1" stroke="#1a6b63" stroke-width="1.5"/>
    <text x="1230" y="94" text-anchor="middle" font-weight="700" fill="#12312a">6. RESPOND</text>
    <text x="1230" y="114" text-anchor="middle" fill="#3a4a46">Up to 10 ranked products</text>
    <text x="1230" y="130" text-anchor="middle" fill="#3a4a46">+ the next question</text>
  </g>

  <!-- pipeline arrows -->
  <g stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="220" y1="110" x2="256" y2="110"/>
    <line x1="440" y1="110" x2="476" y2="110"/>
    <line x1="660" y1="110" x2="696" y2="110"/>
    <line x1="880" y1="110" x2="916" y2="110"/>
    <line x1="1100" y1="110" x2="1136" y2="110"/>
  </g>

  <!-- loop-back: next turn, state persists -->
  <path d="M 1230 70 L 1230 24 L 130 24 L 130 66" fill="none" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="680" y="18" text-anchor="middle" font-size="11" fill="#6b6f76">next turn — state persists</text>

  <!-- LLM-optional pills -->
  <g font-size="10" fill="#c1652b">
    <rect x="150" y="56" width="80" height="20" rx="10" fill="none" stroke="#c1652b" stroke-dasharray="3 2"/>
    <text x="190" y="70" text-anchor="middle">LLM optional</text>
    <rect x="590" y="56" width="80" height="20" rx="10" fill="none" stroke="#c1652b" stroke-dasharray="3 2"/>
    <text x="630" y="70" text-anchor="middle">LLM optional</text>
    <rect x="1030" y="56" width="80" height="20" rx="10" fill="none" stroke="#c1652b" stroke-dasharray="3 2"/>
    <text x="1070" y="70" text-anchor="middle">LLM optional</text>
  </g>

  <!-- ============ Session state bar ============ -->
  <rect x="40" y="230" width="1060" height="50" rx="10" fill="#fdf3e2" stroke="#c1652b" stroke-width="1.5"/>
  <text x="570" y="260" text-anchor="middle" font-size="12" fill="#5c3a1e">Session State — filled_slots · durable_notes · asked_categories · shown_asins  (decayed by age, wiped on intent override)</text>

  <!-- connectors: box -> state (bidirectional) -->
  <g stroke="#c1652b" stroke-width="1.3" stroke-dasharray="4 3" marker-start="url(#arrowAmber)" marker-end="url(#arrowAmber)" font-size="10" fill="#c1652b">
    <line x1="130" y1="150" x2="130" y2="228"/>
    <text x="130" y="200" text-anchor="middle" fill="#c1652b" transform="rotate(0 130 200)">
      <tspan x="130" dy="0">write</tspan>
      <tspan x="130" dy="12">slots</tspan>
    </text>

    <line x1="570" y1="150" x2="570" y2="228"/>
    <text x="570" y="194" text-anchor="middle">
      <tspan x="570" dy="0">read</tspan>
      <tspan x="570" dy="12">notes</tspan>
    </text>

    <line x1="790" y1="150" x2="790" y2="228"/>
    <text x="790" y="194" text-anchor="middle">
      <tspan x="790" dy="0">read/write</tspan>
      <tspan x="790" dy="12">ask</tspan>
    </text>

    <line x1="1010" y1="150" x2="1010" y2="228"/>
    <text x="1010" y="194" text-anchor="middle">
      <tspan x="1010" dy="0">read/write</tspan>
      <tspan x="1010" dy="12">shown</tspan>
    </text>
  </g>

  <!-- ============ RRF fusion inset ============ -->
  <text x="480" y="322" font-size="14" font-weight="700" fill="#12312a">Inside Retrieve: rank-fusion (RRF), not raw scores</text>

  <rect x="500" y="340" width="190" height="44" rx="8" fill="#f4f4f4" stroke="#666666"/>
  <text x="595" y="359" text-anchor="middle" font-size="11" fill="#333333">keyword rank</text>
  <text x="595" y="374" text-anchor="middle" font-size="11" fill="#333333">(BM25 / SQLite FTS5)</text>

  <rect x="730" y="340" width="190" height="44" rx="8" fill="#f4f4f4" stroke="#666666"/>
  <text x="825" y="359" text-anchor="middle" font-size="11" fill="#333333">semantic rank</text>
  <text x="825" y="374" text-anchor="middle" font-size="11" fill="#333333">(cosine similarity)</text>

  <line x1="595" y1="384" x2="670" y2="405" stroke="#666666" marker-end="url(#arrow)"/>
  <line x1="825" y1="384" x2="750" y2="405" stroke="#666666" marker-end="url(#arrow)"/>

  <rect x="560" y="405" width="300" height="36" rx="8" fill="#ffffff" stroke="#666666"/>
  <text x="710" y="428" text-anchor="middle" font-size="11" fill="#333333">score += weight / (60 + rank), per route</text>

  <text x="710" y="465" text-anchor="middle" font-size="11" font-style="italic" fill="#3a4a46">→ fused candidate pool (top 600), then ranked by rank.py</text>

  <!-- connector: Retrieve box -> RRF inset, routed right of the state bar -->
  <path d="M 660 110 L 1340 110 L 1340 330 L 924 330" fill="none" stroke="#1a6b63" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- ============ Legend ============ -->
  <g font-size="11">
    <line x1="40" y1="562" x2="70" y2="562" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="78" y="566" fill="#3a4a46">per-turn data flow (always on, no API key required)</text>

    <line x1="40" y1="586" x2="70" y2="586" stroke="#c1652b" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrowAmber)"/>
    <text x="78" y="590" fill="#c1652b">optional LLM augmentation (off by default, falls back on any failure)</text>
  </g>
</svg>
